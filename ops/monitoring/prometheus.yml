# Prometheus for the `monitoring` compose profile (Q26). Scrapes the gateway
# and ai_engine over the compose network with the METRICS_TOKEN bearer (Q30):
# compose mounts the token as the `metrics_token` secret, so it never appears
# in this file or in `docker inspect`.
global:
  scrape_interval: 30s
  scrape_timeout: 10s

scrape_configs:
  - job_name: patentmind-gateway
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_token
    static_configs:
      - targets: ["gateway:8010"]
        labels:
          service: gateway

  - job_name: patentmind-ai-engine
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_token
    static_configs:
      - targets: ["ai_engine:8011"]
        labels:
          service: ai_engine
