# nginx for the one-container public demo (docker/demo.Dockerfile), running
# as an unprivileged user: pid and temp files under /tmp, logs to the
# container's stdout/stderr. The server block is the frontend image's own
# template (frontend/docker/default.conf.template), rendered at build time.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;

    # One request bucket for the whole demo (on Hugging Face every visitor
    # arrives from the same proxy, so this is effectively site-wide): far
    # above what people clicking around need, low enough that a flood is
    # answered by nginx (503) instead of reaching the gateway — where even a
    # refused request writes an audit row (invariant #4).
    limit_req_zone $binary_remote_addr zone=demo_api:1m rate=20r/s;
    limit_req_status 503;

    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;

    include /etc/nginx/demo/server.conf;
}
