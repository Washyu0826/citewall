# Included in the server block of the public demo only (docker/demo.Dockerfile).
# Endpoints the SPA never calls, closed to anonymous visitors of a shared demo:
# the digiRunner compatibility hooks — /v1/redact (the SPA uses the preview
# alias) and /v1/audit/append (writes into the audit chain every other visitor
# reads). Both are rate limited and size-capped in the gateway too (B-52).
# Applies to every location in the server block (see nginx.conf).
limit_req zone=demo_api burst=60 nodelay;

location = /api/v1/redact {
    return 403;
}
location = /api/v1/audit/append {
    return 403;
}
