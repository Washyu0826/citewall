name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Least privilege by default; the one job that comments on PRs widens its own.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded runs on feature branches/PRs, but never on main:
  # fast-follow commits to main must each be verified independently so a
  # broken-but-cancelled run can't silently mask a regression.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "24"
  PYTHONUTF8: "1"

jobs:
  # ---------------------------------------------------------------------------
  # Backend lint + unit tests (mock / in-memory backends only). Tests that need
  # Postgres / Qdrant / MinIO self-skip here and run in backend-services below.
  # ---------------------------------------------------------------------------
  backend-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        # Only the runtime contract (backend/requirements.txt). The root
        # requirements.txt is a legacy bundle of heavy optional extras
        # (paddleocr, ckip-transformers) that the unit suite does not need —
        # installing it with `|| echo WARN` used to hide real failures.
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          # Pillow: exercised by the PaddleOCR-VL fake-pipeline test.
          # Pin ruff — an unpinned ruff silently enables new lint rules on
          # each release. Bump deliberately, fixing findings in the same PR.
          pip install pillow ruff==0.15.15

      - name: Ruff lint
        run: ruff check .

      - name: Pytest (unit)
        env:
          LLM_MODE: mock
          VECTOR_BACKEND: memory
          EMBEDDING_BACKEND: mock
          CACHE_BACKEND: memory
        run: pytest tests/unit -v

  # ---------------------------------------------------------------------------
  # Static analysis + dependency audit — informational (non-blocking) until the
  # current backlog is cleared: mypy reports ~54 existing errors, and
  # pip-audit flags transformers (transitive via sentence-transformers).
  # ---------------------------------------------------------------------------
  backend-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install mypy pip-audit

      - name: pip-audit (non-blocking)
        continue-on-error: true
        run: pip-audit -r backend/requirements.txt --progress-spinner off

      - name: mypy (non-blocking)
        continue-on-error: true
        run: mypy backend

  # ---------------------------------------------------------------------------
  # Integration tests + every test that needs a real backing service.
  # Postgres (audit, Q13), Redis (cache/quota, Q9/Q18), Qdrant (vectors, Q7)
  # run as service containers; RustFS (WORM archive, Q13) is started as a step
  # so its readiness and the bucket bootstrap are explicit.
  # Service-dependent unit tests (test_audit_postgres / test_vector_store_* /
  # test_audit_archive_s3) are re-run here, where the services exist.
  # ---------------------------------------------------------------------------
  backend-services:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: patentmind
          POSTGRES_PASSWORD: patentmind
          POSTGRES_DB: patentmind
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U patentmind"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      qdrant:
        # Distroless image — no shell for a --health-cmd; tests retry
        # /readyz themselves. Keep in sync with docker-compose.yml.
        image: qdrant/qdrant:v1.19.1
        ports:
          - 6333:6333

    env:
      LLM_MODE: mock
      VECTOR_BACKEND: memory
      EMBEDDING_BACKEND: mock
      CACHE_BACKEND: memory
      # The code reads POSTGRES_URL (not DATABASE_URL).
      POSTGRES_URL: postgresql://patentmind:patentmind@localhost:5432/patentmind
      REDIS_URL: redis://localhost:6379/0
      QDRANT_URL: http://localhost:6333
      ARCHIVE_S3_ENDPOINT: http://localhost:19000
      ARCHIVE_S3_ACCESS_KEY: patentmind
      ARCHIVE_S3_SECRET_KEY: patentmind-worm
      # A missing object store FAILS the S3-archive tests here instead of
      # skipping them (they skipped silently while MinIO was gone, E-4).
      ARCHIVE_S3_REQUIRED: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pillow

      # MinIO left Docker Hub in 2026-09 (FAILURE_LOG E-4). RustFS (Apache-2.0,
      # S3 Object Lock + versioning) is the WORM target now. Pinned: a re-pull
      # must not change the Object Lock semantics the archive relies on.
      # Keep in sync with docker-compose.yml.
      - name: Start RustFS (Object Lock) + create WORM bucket
        run: |
          docker run -d --name rustfs -p 19000:9000 \
            -e RUSTFS_ACCESS_KEY=patentmind -e RUSTFS_SECRET_KEY=patentmind-worm \
            -e RUSTFS_VOLUMES=/data -e RUSTFS_CONSOLE_ENABLE=false \
            rustfs/rustfs:1.0.1
          ready=
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:19000/health; then ready=1; break; fi
            sleep 2
          done
          if [ -z "$ready" ]; then docker logs rustfs; exit 1; fi
          python scripts/init_object_store.py

      - name: Pytest (integration)
        run: pytest tests/integration -v

      - name: Pytest (service-backed unit tests)
        run: >-
          pytest -v
          tests/unit/test_audit_postgres.py
          tests/unit/test_vector_store_contract.py
          tests/unit/test_vector_store_robustness.py
          tests/unit/test_audit_archive_s3.py

  # ---------------------------------------------------------------------------
  # Frontend: lint (ESLint 9 flat config) + vitest unit tests + production
  # build. Blocking.
  # ---------------------------------------------------------------------------
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install (npm ci)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests (vitest)
        run: npm run test:unit

      - name: Build
        run: npm run build

      # Research 09 FE-L4: what loads before the first page renders, in gzip
      # bytes, against budgets in scripts/check-bundle.mjs.
      - name: Bundle size budget
        run: npm run check:bundle

      - name: npm audit (non-blocking)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

  # ---------------------------------------------------------------------------
  # Frontend Playwright e2e (desktop + mobile projects). Functional specs are
  # blocking; visual regression is informational (baselines are generated on
  # Windows, CI renders fonts on Linux).
  # ---------------------------------------------------------------------------
  frontend-e2e:
    runs-on: ubuntu-latest
    needs: frontend
    permissions:
      contents: read
      pull-requests: write # PR comment with visual diffs
      issues: write
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install (npm ci)
        run: npm ci

      # Cache Playwright browsers separately from npm (~150 MB).
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-pw-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-pw-

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Each step writes to its own output dir: Playwright empties its output
      # dir at start, so a shared one let the last step wipe the earlier
      # steps' failure screenshots and traces.
      - name: Playwright functional (desktop)
        run: npx playwright test --project=chromium-desktop --grep-invert "Visual regression" --output=test-results/desktop

      - name: Playwright functional (mobile)
        if: always()
        run: npx playwright test --project=chromium-mobile --grep-invert "Visual regression" --output=test-results/mobile

      - name: Playwright visual regression (non-blocking — platform-specific baselines)
        if: always()
        continue-on-error: true
        run: npx playwright test --grep "Visual regression" --output=test-results/visual

      # Always upload: the visual step is non-blocking, so on a green run its
      # actual screenshots (the Linux baselines to commit) would otherwise be lost.
      - name: Upload Playwright traces + screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Comment on PR with visual regression diffs
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const root = path.join(process.env.GITHUB_WORKSPACE, 'frontend', 'test-results');
            if (!fs.existsSync(root)) return;
            const diffs = [];
            const walk = (dir) => {
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                const full = path.join(dir, entry.name);
                if (entry.isDirectory()) walk(full);
                else if (entry.name.endsWith('-diff.png')) diffs.push(full);
              }
            };
            walk(root);
            if (diffs.length === 0) return;
            const body = [
              '### Visual regression diffs',
              '',
              `${diffs.length} snapshot(s) differ from the baseline.`,
              'Download the `playwright-artifacts` archive to inspect the full diff,',
              'or run `npx playwright test --update-snapshots` locally to refresh.',
              '',
              ...diffs.map((p) => `- \`${path.relative(process.env.GITHUB_WORKSPACE, p)}\``),
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
