<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Patent OA Assistant — privacy-first AI assistant for patent office-action responses." />
    <meta name="theme-color" content="#1e3a8a" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231e3a8a'/%3E%3Ctext x='16' y='22' font-family='-apple-system,Segoe UI,sans-serif' font-size='16' font-weight='700' fill='white' text-anchor='middle'%3EOA%3C/text%3E%3C/svg%3E" />
    <!--
      UX_REVIEW X1 — typography is now the SYSTEM font stack (no web fonts).
      The previous Google Fonts <link> made every attorney's browser call
      fonts.googleapis.com on each load — flatly contradicting the "data
      never leaves the firm" on-prem promise (and a fingerprintable beacon).
      System stacks (SF Pro / Segoe UI / Microsoft JhengHei / Noto Sans TC
      via the OS) are also what Apple/Google themselves ship: zero network,
      zero FOUT, native CJK shaping. Stack lives in src/index.css.
    -->
    <title>Patent OA Assistant</title>
  </head>
  <body>
    <script>
      // Pre-React theme application to avoid FOUC on dark-mode reload.
      // Mirrors logic in src/lib/theme.jsx — keep them in sync.
      try {
        var t = localStorage.getItem('theme');
        if (t === 'dark') document.documentElement.classList.add('dark');
      } catch (e) {
        /* localStorage blocked — ignore */
      }
      // Pre-React language attribute so assistive tech + font shaping are
      // correct on first paint. Mirrors src/lib/i18n.js (key 'pm.lang').
      try {
        var l = localStorage.getItem('pm.lang');
        document.documentElement.lang = l === 'en' ? 'en' : 'zh-Hant';
      } catch (e2) {
        /* localStorage blocked — keep the static lang attribute */
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
