# docker-compose.rag.yml — opt-in real RAG stack (Q7).
#
# Stands up a single Qdrant node for the bge-m3 + Qdrant retrieval path. Kept
# SEPARATE from the repo's other compose file(s) so the RAG infra is opt-in:
# operators who only want the mock/memory POC never pull this image.
#
#   Bring up:   bash scripts/start_rag_stack.sh        (waits for healthy)
#   Tear down:  docker compose -f docker-compose.rag.yml down
#   Wipe data:  docker compose -f docker-compose.rag.yml down -v
#
# After it's healthy, switch the app to the real backend (see .env.example):
#   export VECTOR_BACKEND=qdrant EMBEDDING_BACKEND=bge-m3
#   python scripts/prefetch_bge_m3.py     # one-time model cache
#   python scripts/rag_smoke.py           # prints REAL recall@5 / MRR
services:
  qdrant:
    # Pinned (NOT :latest) so an operator's stack is reproducible and the
    # stored-segment format can't drift under them on a re-pull.
    image: qdrant/qdrant:v1.19.1
    container_name: patentmind-rag-qdrant
    ports:
      - "127.0.0.1:6333:6333"   # HTTP (loopback only — no auth on this Qdrant) / REST  (readyz, dashboard, qdrant-client default)
      - "127.0.0.1:6334:6334"   # gRPC
    volumes:
      - qdrant_rag_storage:/qdrant/storage
    restart: unless-stopped
    # No in-container healthcheck: the v1.19 image is not guaranteed to ship
    # curl/wget (docker-compose.yml notes the official image as distroless), and
    # a failing probe would mark a healthy Qdrant "unhealthy".
    # start_rag_stack.sh polls /readyz from the HOST instead.

volumes:
  # Named volume → survives `down` (use `down -v` to wipe). Distinct name from
  # any other compose file's volume so the two stacks never share storage.
  qdrant_rag_storage:
